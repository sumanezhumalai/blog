<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">VPS exposure before and after Tailscale</title>
  <desc id="d">Before: bots and scanners on the internet reach SSH on port 22 of the VPS. After: visitors reach only ports 80 and 443, while your laptop reaches the VPS through a private tailnet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.28"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#fb7185"/></marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#67e8f9"/></marker>

    <!-- reusable icons (origin = center) -->
    <g id="globe" fill="none" stroke="#94a3b8" stroke-width="1.8">
      <circle r="32"/><ellipse rx="13" ry="32"/><line x1="-32" y1="0" x2="32" y2="0"/>
      <path d="M-28,-14 H28 M-28,14 H28" stroke-opacity="0.55"/>
    </g>
    <g id="server">
      <rect x="-48" y="-46" width="96" height="26" rx="8"/><rect x="-48" y="-13" width="96" height="26" rx="8"/><rect x="-48" y="20" width="96" height="26" rx="8"/>
      <circle cx="-34" cy="-33" r="3" stroke="none"/><circle cx="-34" cy="0" r="3" stroke="none"/><circle cx="-34" cy="33" r="3" stroke="none"/>
    </g>
    <g id="laptop" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linejoin="round">
      <rect x="-30" y="-22" width="60" height="38" rx="5"/><path d="M-40,22 H40 L34,16 H-34 Z"/>
    </g>
    <path id="shield" d="M0,-17 L14,-11 V4 C14,13 6,18 0,21 C-6,18 -14,13 -14,4 V-11 Z"/>
  </defs>

  <rect width="1000" height="460" rx="24" fill="url(#bg)"/>

  <!-- panels -->
  <rect x="28" y="28" width="456" height="404" rx="18" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.09"/>
  <rect x="516" y="28" width="456" height="404" rx="18" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.09"/>
  <circle cx="380" cy="236" r="120" fill="url(#redGlow)"/>
  <circle cx="860" cy="236" r="120" fill="url(#cyanGlow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- pills -->
    <rect x="52" y="52" width="86" height="28" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.45"/>
    <text x="95" y="71" font-size="12.5" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#fda4af">BEFORE</text>
    <rect x="540" y="52" width="78" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="579" y="71" font-size="12.5" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#67e8f9">AFTER</text>

    <!-- BEFORE -->
    <use href="#globe" x="118" y="236"/>
    <text x="118" y="296" font-size="14" fill="#94a3b8" text-anchor="middle">bots &amp; scanners</text>
    <g stroke="#fb7185" stroke-width="1.8" fill="none" marker-end="url(#arrRed)">
      <line x1="162" y1="216" x2="318" y2="208" stroke-opacity="0.9"/>
      <line x1="164" y1="236" x2="318" y2="236"/>
      <line x1="162" y1="256" x2="318" y2="264" stroke-opacity="0.9"/>
    </g>
    <g fill="none" stroke="#fb7185" stroke-width="2"><use href="#server" x="380" y="236"/></g>
    <g fill="#fb7185"><circle cx="346" cy="203" r="3"/><circle cx="346" cy="236" r="3"/><circle cx="346" cy="269" r="3"/></g>
    <text x="380" y="164" font-size="13" font-weight="700" text-anchor="middle" fill="#fda4af">VPS</text>
    <rect x="336" y="304" width="88" height="26" rx="13" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="380" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#fda4af">:22 open</text>
    <text x="256" y="398" font-size="15" text-anchor="middle" fill="#cbd5e1">SSH is reachable by everyone</text>

    <!-- AFTER -->
    <use href="#globe" x="600" y="170" transform="translate(0 0)"/>
    <text x="600" y="228" font-size="14" fill="#94a3b8" text-anchor="middle">visitors</text>
    <use href="#laptop" x="600" y="326"/>
    <text x="600" y="368" font-size="14" fill="#e2e8f0" text-anchor="middle">your laptop</text>

    <line x1="642" y1="176" x2="808" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrGray)"/>
    <rect x="690" y="172" width="86" height="26" rx="13" fill="#0a0f1f" stroke="#94a3b8" stroke-opacity="0.6"/>
    <text x="733" y="190" font-size="12.5" font-weight="600" text-anchor="middle" fill="#cbd5e1">80 / 443</text>

    <path d="M648,326 C720,326 740,262 808,258" fill="none" stroke="url(#ok)" stroke-width="2.4" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#arrCyan)"/>
    <g transform="translate(724 300)">
      <circle r="21" fill="#0a0f1f" stroke="url(#ok)" stroke-width="1.6"/>
      <g transform="scale(0.85)"><use href="#shield" fill="#22d3ee" fill-opacity="0.18" stroke="#67e8f9" stroke-width="1.6" stroke-linejoin="round"/></g>
    </g>
    <text x="724" y="342" font-size="12.5" font-weight="600" letter-spacing="1.5" text-anchor="middle" fill="#67e8f9">TAILNET</text>

    <g fill="none" stroke="#67e8f9" stroke-width="2"><use href="#server" x="860" y="236"/></g>
    <g fill="#67e8f9"><circle cx="826" cy="203" r="3"/><circle cx="826" cy="236" r="3"/><circle cx="826" cy="269" r="3"/></g>
    <text x="860" y="164" font-size="13" font-weight="700" text-anchor="middle" fill="#67e8f9">VPS</text>
    <rect x="800" y="304" width="120" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="860" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#67e8f9">web ports only</text>
    <text x="744" y="398" font-size="15" text-anchor="middle" fill="#cbd5e1">Admin access lives on the tailnet</text>
  </g>
</svg>
