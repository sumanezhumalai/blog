<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Private by default: a shield at the center of a private mesh network</title>
  <desc id="d">A glowing shield with a keyhole sits at the center of concentric rings. Connected nodes orbit around it, representing devices on a private network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#15123a"/>
      <stop offset="1" stop-color="#062431"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="600" cy="300" r="380" fill="url(#glowC)"/>
  <circle cx="1040" cy="90" r="300" fill="url(#glowP)"/>

  <!-- rings -->
  <g fill="none" stroke="#fff">
    <circle cx="600" cy="300" r="105" stroke-opacity="0.14"/>
    <circle cx="600" cy="300" r="200" stroke-opacity="0.12" stroke-dasharray="3 9"/>
    <circle cx="600" cy="300" r="285" stroke-opacity="0.08"/>
  </g>

  <!-- links: center to inner nodes -->
  <g stroke="url(#link)" stroke-width="1.6" fill="none">
    <line x1="600" y1="300" x2="600" y2="100"/>
    <line x1="600" y1="300" x2="773" y2="400"/>
    <line x1="600" y1="300" x2="427" y2="400"/>
  </g>
  <!-- links: inner to outer -->
  <g stroke="#a5b4fc" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="600" y1="100" x2="870" y2="205"/>
    <line x1="600" y1="100" x2="330" y2="205"/>
    <line x1="773" y1="400" x2="760" y2="540"/>
    <line x1="773" y1="400" x2="870" y2="205"/>
    <line x1="427" y1="400" x2="330" y2="205"/>
  </g>

  <!-- node glows -->
  <g fill="#22d3ee" fill-opacity="0.55" filter="url(#blur)">
    <circle cx="600" cy="100" r="9"/><circle cx="773" cy="400" r="9"/><circle cx="427" cy="400" r="9"/>
  </g>
  <!-- inner nodes -->
  <g fill="#0a0f1f" stroke="url(#accent)" stroke-width="2.2">
    <circle cx="600" cy="100" r="12"/><circle cx="773" cy="400" r="12"/><circle cx="427" cy="400" r="12"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="600" cy="100" r="3.6"/><circle cx="773" cy="400" r="3.6"/><circle cx="427" cy="400" r="3.6"/>
  </g>
  <!-- outer nodes -->
  <g fill="#0a0f1f" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.6">
    <circle cx="870" cy="205" r="8"/><circle cx="330" cy="205" r="8"/><circle cx="760" cy="540" r="8"/>
  </g>
  <g fill="#c7d2fe">
    <circle cx="870" cy="205" r="2.6"/><circle cx="330" cy="205" r="2.6"/><circle cx="760" cy="540" r="2.6"/>
  </g>

  <!-- shield -->
  <circle cx="600" cy="300" r="70" fill="#22d3ee" fill-opacity="0.35" filter="url(#soft)"/>
  <g transform="translate(600 304) scale(3.6)">
    <path d="M0,-17 L14,-11 V4 C14,13 6,18 0,21 C-6,18 -14,13 -14,4 V-11 Z" fill="#0a0f1f" fill-opacity="0.85" stroke="url(#accent)" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="0" cy="-2.5" r="3" fill="none" stroke="#e0f2fe" stroke-width="1.1"/>
    <path d="M0,0.5 V8" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- typography -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="60" y="52" width="262" height="32" rx="16" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
    <circle cx="80" cy="68" r="4" fill="#67e8f9"/>
    <text x="96" y="73" font-size="13" letter-spacing="2.2" fill="#cbd5e1" font-weight="600">SYSADMIN  ·  TAILSCALE</text>
    <text x="60" y="556" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Private by default.</text>
    <text x="60" y="592" font-size="20" fill="#94a3b8">Close port 22. Keep the access.</text>
  </g>
</svg>
