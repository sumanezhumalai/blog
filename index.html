<!DOCTYPE html>
<!--

  keyboard shortcuts

  g  grid
  b  black
  w  white
  s  sunlight

-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Blog — Template</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="A blog template with a clean, themeable design system.">

  <link rel="stylesheet" href="/styles/normalize-8.0.1.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/font.css">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/color.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/grid.css">
  <link rel="stylesheet" href="/styles/media-queries.css">

  <script src="/scripts/modernizr.js"></script>
  <script src="/scripts/jquery-3.7.1.min.js"></script>
  <script src="/scripts/jquery-easing-1.4.1.js"></script>
  <script src="/scripts/script.js"></script>

</head>

<body class="cover--is--visible is--loading theme--16">

  <header class="app-header">
    <div class="content">

      <div class="brand">
        <h3><span>B</span><span>l</span><span>o</span><span>g</span></h3>
      </div>

      <div class="actions">
        <div class="option navigation">
          <div class="content">
            <div class="icon">
              <div class="line">
                <div class="content"></div>
              </div>
              <div class="line">
                <div class="content"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </header>

  <nav class="app-nav">
    <div class="content">
      <div class="item intro is--active">Intro</div>
      <div class="item posts">Posts</div>
      <div class="item topics">Topics</div>
      <div class="item about">About</div>
      <div class="item contact">Contact</div>
    </div>
  </nav>

  <main class="app-main">

    <!--
    COVER SECTION — preserved as template feature
    Uncomment to restore the animated cover/splash screen on page load.
    ============================================================

    <section class="section cover">
      <div class="content">
        <h1>Blog<br>—Title </h1>
      </div>
    </section>

    ============================================================
    END COVER SECTION -->

    <!-- Blog content sections will be added here -->

    <section class="section contact">
      <div class="content">

        <div class="text">

          <div class="content">

            <div class="look">
              <div class="radius"></div>
              <div class="dot"></div>
            </div>

            <div class="status">
              <h3>Available — open to new conversations</h3>
            </div>

            <div class="interest">
              <h2>Let's talk. Drop a message anytime.</h2>
            </div>

          </div>

          <div class="actions">
            <div class="item"><a href="mailto:hello@example.com">hello@example.com</a></div>
          </div>

        </div>

      </div>
    </section>

  </main>

  <aside class="app-aside">

    <div class="options">

      <div class="option theme">

        <div class="icon-container">
          <svg class="icon theme" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
            <path
              d="M17 2h-2v6h2V2zm-1 8c-3.31372 0-6 2.68628-6 6s2.68628 6 6 6 6-2.68628 6-6-2.68628-6-6-6zm0 10c-2.20911 0-4-1.79089-4-4s1.79089-4 4-4 4 1.79089 4 4-1.79089 4-4 4zm-1 10h2v-6h-2v6zM11.05029 9.63605 6.80762 5.39337 5.39337 6.80762l4.24268 4.24268 1.41424-1.41425zm9.89954 12.72796 4.24255 4.24261 1.41425-1.41425-4.24261-4.24268-1.41419 1.41432zM8 15H2v2h6v-2zm16 0v2h6v-2h-6zM5.39337 25.19238l1.41425 1.41425 4.24268-4.24261-1.41425-1.41431-4.24268 4.24267zM26.60663 6.80762l-1.41425-1.41425-4.24268 4.24268 1.41431 1.41412 4.24262-4.24255z" />
          </svg>
        </div>

        <div class="slider-container">
          <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <input class="slider" type="range" min="0" max="16" step="1" value="0" />
        </div>

      </div>

      <div class="option grid">
        <div class="content">
          <svg class="icon grid" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
            <path d="M5 28h2V4H5v24zm5 0h2V4h-2v24zm5 0h2V4h-2v24zm5 0h2V4h-2v24zm5-24v24h2V4h-2z" />
          </svg>
        </div>
      </div>

    </div>

  </aside>

  <div class="app-grid-overlay">
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="column">
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </div>

</body>

</html>
